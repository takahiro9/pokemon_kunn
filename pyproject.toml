[project]
name = "pokemon-kunn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
    "poke-env>=0.16.1",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
